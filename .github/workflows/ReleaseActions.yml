name: "Release actions"

on:
  release:
    types: ["published"]

env:
  PYTHON_VERSION: "3.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build distribution
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: "Set version number from tag"
        run: |
          echo -n '${{ github.ref_name }}' > ./VERSION
          sed -i 's/dev/${{ github.ref_name }}/g' ./src/version.ts
          cat ./VERSION
          cat ./src/version.ts

      - name: Install dependencies
        run: |
          python -m pip install build
          corepack enable pnpm
          ./script/bootstrap

      - name: Build
        run: pnpm build
        env:
          # Release runners start cold, and building without the babel-loader cache keeps the
          # release output independent of any cache state.
          BABEL_CACHE_DIR: "false"

      - name: Build Python package
        run: python -m build

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/knx-frontend/${{ github.ref_name }}/
    permissions:
      # Required for PyPI trusted publishing (OIDC)
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
