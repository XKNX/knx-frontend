name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Run eslint
        run: pnpm run lint:eslint

      - name: Run prettier
        run: pnpm run lint:prettier

      - name: Generate Lit check inputs
        run: pnpm exec gulp gen-icons-json build-translations build-locale-data

      - name: Check Lit templates
        run: pnpm run lint:lit

      - name: Check Gallery tool syntax
        run: pnpm run gallery:lint:tools

      - name: Check for duplicate dependencies
        run: pnpm dedupe --check

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      # tsc resolves generated HA icon and translation imports without a full build.
      - name: Generate build inputs
        run: pnpm exec gulp gen-icons-json build-translations build-locale-data

      - name: Run tsc
        run: pnpm run lint:types

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Generate build inputs
        run: SKIP_FETCH_NIGHTLY_TRANSLATIONS=1 pnpm exec gulp gen-icons-json build-translations build-locale-data

      - name: Run tests
        run: pnpm test --exclude '**/.worktrees/**'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Generate build inputs
        run: SKIP_FETCH_NIGHTLY_TRANSLATIONS=1 pnpm exec gulp gen-icons-json build-translations build-locale-data

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        # always() to also upload coverage if tests are failing
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./test/coverage
          fail_ci_if_error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    # Surfaced by the `size` job below, whose name is this string.
    outputs:
      size: ${{ steps.size.outputs.summary }}
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      # Restores the newest cache for the current pnpm-lock.yaml. Only runs on `main` save the cache,
      # each under a new key (pnpm-lock.yaml hash + commit SHA).
      - name: Restore babel-loader cache
        id: babel-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/babel-loader
          key: babel-loader-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: babel-loader-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
        env:
          BABEL_CACHE_DIR: ${{ runner.temp }}/babel-loader

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Build wheel
        run: |
          python -m pip install build
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          version = Path("VERSION")
          original = version.read_bytes()
          try:
              version.write_text("0.0.0.dev0")
              subprocess.run(["python", "-m", "build"], check=True)
          finally:
              version.write_bytes(original)
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          PYTHON

      # babel-loader writes an entry only on a cache miss, so a file's age is the time since it was
      # created. Entries older than 30 days are dropped and transpiled again on their next use.
      - name: Prune old babel-loader cache entries
        if: github.ref == 'refs/heads/main'
        run: find "${{ runner.temp }}/babel-loader" -type f -mtime +30 -delete

      - name: Save babel-loader cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/babel-loader
          key: ${{ steps.babel-cache.outputs.cache-primary-key }}

      - name: Report output size
        id: size
        run: |
          pnpm run build:size --markdown .build-size.md
          cat .build-size.md >> "$GITHUB_STEP_SUMMARY"

  # The shipped wheel is just knx_frontend/ zipped up, so its size is what every Home Assistant
  # install pays for — and it is easy to inflate by accident. Put it in the check list where it
  # cannot be missed. A job's own name is fixed before it runs and cannot report its result, but
  # `needs` is allowed in `jobs.<id>.name`, so a downstream job can be *named* after the number:
  #   CI / Size: 30.44 MB download, 64.39 MB installed (pull_request)
  size:
    # Quoted: an unquoted value containing ": " is not valid YAML here.
    name: "Size: ${{ needs.build.outputs.size }}"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Build output size
        run: echo "${{ needs.build.outputs.size }}"
