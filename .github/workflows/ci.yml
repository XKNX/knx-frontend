name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Run eslint
        run: yarn run lint:eslint

      - name: Run prettier
        run: yarn run lint:prettier

      - name: Check for duplicate dependencies
        run: yarn dedupe --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Run tests
        run: yarn test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: yarn run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        # always() to also upload coverage if tests are failing
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./test/coverage
          fail_ci_if_error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    # Surfaced by the `size` job below, whose name is this string.
    outputs:
      size: ${{ steps.size.outputs.summary }}
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: yarn build

      - name: Report output size
        id: size
        run: |
          yarn run build:size --markdown .build-size.md
          cat .build-size.md >> "$GITHUB_STEP_SUMMARY"

  # The shipped wheel is just knx_frontend/ zipped up, so its size is what every Home Assistant
  # install pays for — and it is easy to inflate by accident. Put it in the check list where it
  # cannot be missed. A job's own name is fixed before it runs and cannot report its result, but
  # `needs` is allowed in `jobs.<id>.name`, so a downstream job can be *named* after the number:
  #   CI / Size: 30.44 MB download, 64.39 MB installed (pull_request)
  size:
    # Quoted: an unquoted value containing ": " is not valid YAML here.
    name: "Size: ${{ needs.build.outputs.size }}"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Build output size
        run: echo "${{ needs.build.outputs.size }}"
