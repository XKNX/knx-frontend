name: 'Setup Node.js and Install Dependencies'
description: 'Set up Node.js environment and install project dependencies with caching'

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      id: setup-node
      with:
        node-version-file: ".nvmrc"

    - name: Enable Corepack
      shell: bash
      run: corepack enable pnpm

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache knx-frontend dependencies
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.pnpm-store.outputs.path }}
          node_modules
        key: knx-frontend-deps-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        restore-keys: |
          knx-frontend-deps-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-
          knx-frontend-deps-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: script/bootstrap
